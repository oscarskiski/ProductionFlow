<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>elmo's Production — Part Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f2ee; --bg-2: #ece8e0;
    --surface: #ffffff; --surface-2: #fbf9f5; --surface-3: #f1eee7;
    --ink: #1a1d24; --ink-2: #4a4e5a; --ink-3: #8a8e99;
    --hairline: rgba(26,29,36,0.08); --hairline-2: rgba(26,29,36,0.12);
    --navy: #1f2a44; --navy-soft: rgba(31,42,68,0.08);
    --amber: #e89a3c; --amber-2: #f0ae5c; --amber-soft: rgba(232,154,60,0.14);
    --red: #d2533a; --red-soft: rgba(210,83,58,0.10);
    --green: #4caf6a; --green-soft: rgba(76,175,106,0.12);
    --teal: #3a9aaf; --teal-soft: rgba(58,154,175,0.12);
    --blue: #4677c8; --blue-soft: rgba(70,119,200,0.12);
    --purple: #8b5fbf; --purple-soft: rgba(139,95,191,0.12);
    --shadow-card: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(26,29,36,0.04), 0 8px 20px rgba(26,29,36,0.04);
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  }
  [data-theme="dark"] {
    --bg: #0e1118; --bg-2: #131722;
    --surface: #1a1f2c; --surface-2: #20263488; --surface-3: #232938;
    --ink: #f1f2f5; --ink-2: #b8bcc8; --ink-3: #7c8090;
    --hairline: rgba(255,255,255,0.07); --hairline-2: rgba(255,255,255,0.12);
    --navy: #2e3d63; --navy-soft: rgba(88,114,180,0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; min-height: 100vh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--ink); letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background: radial-gradient(120% 80% at 50% 0%, var(--surface-2) 0%, var(--bg) 40%, var(--bg-2) 100%);
  }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

  /* Sidebar (same as other pages) */
  .side { background: var(--surface); border-right: 1px solid var(--hairline); padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 4px 8px; border-bottom: 1px solid var(--hairline); }
  .brand .mark { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--hairline-2); display: flex; align-items: center; justify-content: center; background: var(--surface-2); flex-shrink: 0; }
  .brand .name b { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; display: block; line-height: 1.15; }
  .brand .name b em { font-style: normal; color: var(--amber); }
  .brand .name span { font-size: 10px; color: var(--ink-3); font-weight: 500; }
  .ctx-card { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ctx-card .row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .ctx-card .row b { color: var(--ink); font-weight: 600; }
  .role-pill { align-self: flex-start; background: var(--navy); color: white; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase; }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-title { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; padding: 8px 10px 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--navy-soft); color: var(--navy); font-weight: 600; }
  [data-theme="dark"] .nav-item[aria-current="page"] { color: var(--amber-2); }
  .nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; color: var(--ink-3); }
  .nav-item[aria-current="page"] .ic { color: var(--navy); }
  [data-theme="dark"] .nav-item[aria-current="page"] .ic { color: var(--amber-2); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 7px; padding-top: 10px; border-top: 1px solid var(--hairline); }
  .util-row { display: flex; gap: 5px; }
  .util-btn { flex: 1; appearance: none; border: 1px solid var(--hairline-2); background: var(--surface-2); color: var(--ink-2); border-radius: 9px; padding: 7px 8px; font: inherit; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
  .signout { width: 100%; appearance: none; border: 1px solid rgba(210,83,58,0.25); background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 9px; font: inherit; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }
  .meta-foot { font-size: 10px; color: var(--ink-3); display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 0; }
  .meta-foot .sync { display: flex; align-items: center; gap: 5px; }
  .meta-foot .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

  /* Main */
  .main { padding: 18px 22px 30px; min-width: 0; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .topbar h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; margin: 0; line-height: 1.1; }
  .topbar .sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .topbar-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ibtn { appearance: none; border: 1px solid var(--hairline-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; font-weight: 500; padding: 7px 11px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 1px 2px rgba(26,29,36,0.04); }
  .ibtn:hover { background: var(--surface-2); }
  .ibtn .ic { width: 13px; height: 13px; color: var(--ink-2); }
  .ibtn.primary { background: var(--navy); color: white; border-color: var(--navy); box-shadow: 0 6px 14px rgba(31,42,68,0.22); }
  .ibtn.primary .ic { color: white; }

  .filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .dept-tabs { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px; }
  .dept-tab { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .dept-tab .ic { width: 13px; height: 13px; color: var(--ink-3); }
  .dept-tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 2px 4px rgba(26,29,36,0.05); font-weight: 600; }
  .dept-tab[aria-pressed="true"] .ic { color: var(--navy); }

  .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--hairline-2); border-radius: 10px; padding: 7px 11px; min-width: 220px; }
  .search-box input { border: 0; background: transparent; outline: 0; font: inherit; font-size: 12px; color: var(--ink); width: 100%; }
  .search-box .ic { color: var(--ink-3); }

  /* Stats strip */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 4px; }
  .stat .l { font-size: 10px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .stat .v { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .v small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
  .stat .d { font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  .stat .d .pos { color: var(--green); font-weight: 600; }
  .stat .d .neg { color: var(--red); font-weight: 600; }
  .stat.accent-amber { border-left: 3px solid var(--amber); }
  .stat.accent-green { border-left: 3px solid var(--green); }
  .stat.accent-blue { border-left: 3px solid var(--blue); }
  .stat.accent-red { border-left: 3px solid var(--red); }

  /* Order tracking cards */
  .ord-list { display: flex; flex-direction: column; gap: 12px; }
  .ord-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .ord-head {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 12px;
    padding: 14px 16px;
    align-items: center;
    cursor: pointer;
    background: var(--surface);
    transition: background 120ms ease;
  }
  .ord-head:hover { background: var(--surface-2); }
  .ord-head .pri {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--amber-soft); color: var(--amber);
    font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ord-head .pri.p1 { background: var(--red-soft); color: var(--red); }
  .ord-head .pri.p5 { background: var(--amber-soft); color: var(--amber); }
  .ord-head .info { min-width: 0; }
  .ord-head .info .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ord-head .info .ord-num {
    font-size: 13px; font-weight: 700; color: var(--ink-3);
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  .ord-head .info .name {
    font-size: 17px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.015em;
  }
  .wk-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--blue-soft); color: var(--blue);
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; letter-spacing: 0.02em;
  }
  .wk-chip.late { background: var(--red-soft); color: var(--red); }
  .wk-chip.next { background: var(--green-soft); color: var(--green); }
  .ord-head .info .meta {
    margin-top: 4px;
    font-size: 12px; color: var(--ink-2);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .ord-head .info .meta .sep { color: var(--hairline-2); }
  .ord-head .info .meta .cust { color: var(--ink-2); font-weight: 500; }
  .ord-head .info .progress {
    margin-top: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .progress-bar {
    flex: 1; height: 6px; background: var(--surface-3);
    border-radius: 3px; overflow: hidden; position: relative;
  }
  .progress-bar i {
    display: block; height: 100%; background: var(--amber);
    border-radius: 3px; transition: width 200ms ease;
  }
  .progress-bar.done i { background: var(--green); }
  .progress-bar.behind i { background: var(--red); }
  .progress-text {
    font-size: 11px; font-weight: 600; color: var(--ink-2);
    font-variant-numeric: tabular-nums; min-width: 60px;
  }
  .ord-head .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .ord-head .right .wkdone { font-size: 10px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.06em; }
  .ord-head .right .qty { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
  .ord-head .right .qty small { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-left: 2px; }
  .ord-head .chev {
    width: 24px; height: 24px; border-radius: 6px;
    color: var(--ink-3); display: flex; align-items: center; justify-content: center;
    transition: transform 180ms ease, background 120ms ease;
  }
  .ord-head:hover .chev { background: var(--surface-3); color: var(--ink); }
  .ord-card.expanded .ord-head .chev { transform: rotate(90deg); }

  /* Steps */
  .steps {
    border-top: 1px solid var(--hairline);
    background: var(--surface-2);
    padding: 4px 0;
    display: none;
  }
  .ord-card.expanded .steps { display: block; }
  .step {
    display: grid;
    grid-template-columns: 28px 26px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 16px 10px 52px;
    border-top: 1px solid var(--hairline);
    cursor: pointer;
    position: relative;
    transition: background 120ms ease;
  }
  .step:first-child { border-top: 0; }
  .step:hover { background: var(--surface); }
  .step .ply {
    width: 22px; height: 22px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3);
  }
  .step .num {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--amber-soft); color: var(--amber);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .step.done .num { background: var(--green-soft); color: var(--green); }
  .step .label {
    font-size: 13px; font-weight: 500; color: var(--ink);
  }
  .step.done .label { color: var(--ink-2); }
  .step .label .badge {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 8px;
    background: var(--blue-soft); color: var(--blue);
    font-size: 9px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; letter-spacing: 0.06em; text-transform: uppercase;
    vertical-align: middle;
  }
  .step .qty {
    font-size: 14px; font-weight: 700; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .step .qty small { font-size: 10px; font-weight: 600; color: var(--ink-3); margin-left: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .step .status {
    font-size: 11px; font-weight: 600;
    color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 4px;
    min-width: 60px; justify-content: flex-end;
  }
  .step.done .status { color: var(--green); }
  .step.partial .status { color: var(--amber); }
  .step .status .check { width: 14px; height: 14px; }
  .step.done {
    background: linear-gradient(90deg, var(--green-soft) 0%, transparent 60%);
  }

  .ic { display: inline-block; vertical-align: middle; }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

    case 'up': return <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    case 'chev-r': return <svg {...p}><path d="m9 18 6-6-6-6"/></svg>;
    case 'expand': return <svg {...p}><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>;
    case 'collapse': return <svg {...p}><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>;
    case 'walk': return <svg {...p}><circle cx="13" cy="4" r="2"/><path d="m15 21-2-7-3-3 3-5 3 5 3 1"/><path d="m6 21 3-9 3 3"/></svg>;
    case 'check': return <svg {...p}><polyline points="20 6 9 17 4 12"/></svg>;
    case 'minus': return <svg {...p}><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    case 'key': return <svg {...p}><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="m15.5 7.5 3 3M19 5l3 3"/></svg>;
    case 'sun': return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>;
    case 'moon': return <svg {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>;
    default: return null;
  }
};

function ProgressLabel({ done, total, behind }) {
  const pct = total > 0 ? (done / total) * 100 : 0;
  return (
    <>
      <div className={`progress-bar ${done === total && total > 0 ? 'done' : behind ? 'behind' : ''}`}>
        <i style={{ width: `${pct}%` }}/>
      </div>
      <span className="progress-text">{done}/{total} done</span>
    </>
  );
}

function Step({ s }) {
  const [done, setDone] = useState(s.status === 'done');
  const isPartial = s.status === 'partial';
  const cls = done ? 'done' : isPartial ? 'partial' : '';
  return (
    <div className={`step ${cls}`} onClick={() => setDone(d => !d)}>
      <div className="ply"><I n="chev-r" s={13}/></div>
      <div className="num">{s.num}</div>
      <div className="label">
        {s.name}
        {s.badge && <span className="badge">{s.badge}</span>}
      </div>
      <div className="qty">{s.qty}<small>parts</small></div>
      <div className="status">
        {done ? <><I n="check" s={13} w={2.4} className="check"/> Done</>
          : isPartial ? <>{s.done}/{s.total} <I n="check" s={12}/></>
          : <I n="minus" s={14}/>}
      </div>
    </div>
  );
}

function OrderCard({ o, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className={`ord-card ${open ? 'expanded' : ''}`}>
      <div className="ord-head" onClick={() => setOpen(v => !v)}>
        <div className={`pri p${o.pri}`}>{o.pri}</div>
        <div className="info">
          <div className="top">
            <span className="ord-num">O{o.num}</span>
            <span className="name">{o.name}</span>
            <span className={`wk-chip ${o.wkClass || ''}`}>
              <I n={o.dept === 'steel' ? 'hammer' : o.dept === 'wood' ? 'saw' : o.dept === 'uphol' ? 'thread' : 'truck'} s={11}/>
              {o.wk}
            </span>
            <span className="cust">· {o.cust}</span>
          </div>
          <div className="progress">
            <ProgressLabel done={o.progress.done} total={o.progress.total} behind={o.progress.behind}/>
          </div>
        </div>
        <div className="right">
          <span className="wkdone">{o.wkdone}</span>
          <span className="qty">{o.qty}<small>parts</small></span>
        </div>
      </div>
      <div className="steps">
        {o.steps.map((s, i) => <Step key={i} s={s}/>)}
      </div>
    </div>
  );
}
