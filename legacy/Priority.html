<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>elmo's Production — Week Priority</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f2ee; --bg-2: #ece8e0;
    --surface: #ffffff; --surface-2: #fbf9f5; --surface-3: #f1eee7;
    --ink: #1a1d24; --ink-2: #4a4e5a; --ink-3: #8a8e99;
    --hairline: rgba(26,29,36,0.08); --hairline-2: rgba(26,29,36,0.12);
    --navy: #1f2a44; --navy-2: #2a3656; --navy-soft: rgba(31,42,68,0.08);
    --amber: #e89a3c; --amber-2: #f0ae5c; --amber-soft: rgba(232,154,60,0.14);
    --red: #d2533a; --red-soft: rgba(210,83,58,0.10);
    --green: #4caf6a; --green-soft: rgba(76,175,106,0.12);
    --yellow: #d4a531; --yellow-soft: rgba(212,165,49,0.14);
    --shadow-card: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(26,29,36,0.04), 0 8px 20px rgba(26,29,36,0.04);
    --shadow-pop: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(26,29,36,0.06), 0 12px 28px rgba(26,29,36,0.10);
    --shadow-btn: 0 1px 0 rgba(255,255,255,0.18) inset, 0 6px 16px rgba(31,42,68,0.24), 0 2px 4px rgba(31,42,68,0.16);
    --r-sm: 12px; --r-md: 16px; --r-lg: 22px;
  }
  [data-theme="dark"] {
    --bg: #0e1118; --bg-2: #131722;
    --surface: #1a1f2c; --surface-2: #20263488; --surface-3: #232938;
    --ink: #f1f2f5; --ink-2: #b8bcc8; --ink-3: #7c8090;
    --hairline: rgba(255,255,255,0.07); --hairline-2: rgba(255,255,255,0.12);
    --navy: #2e3d63; --navy-2: #3a4b76; --navy-soft: rgba(88,114,180,0.18);
    --amber: #f0ae5c; --amber-2: #f5c178; --amber-soft: rgba(240,174,92,0.16);
    --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 20px rgba(0,0,0,0.4);
    --shadow-pop: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 28px rgba(0,0,0,0.45);
    --shadow-btn: 0 1px 0 rgba(255,255,255,0.12) inset, 0 6px 16px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; min-height: 100vh;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--ink); letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background: radial-gradient(120% 80% at 50% 0%, var(--surface-2) 0%, var(--bg) 40%, var(--bg-2) 100%);
  }
  .app { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }

  /* Sidebar (matches Dashboard) */
  .side {
    background: var(--surface); border-right: 1px solid var(--hairline);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 14px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; border-bottom: 1px solid var(--hairline); }
  .brand .mark { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--hairline-2); display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
  .brand .name b { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; display: block; }
  .brand .name b em { font-style: normal; color: var(--amber); }
  .brand .name span { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .ctx-card { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ctx-card .row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .ctx-card .row b { color: var(--ink); font-weight: 600; }
  .role-pill { align-self: flex-start; background: var(--navy); color: white; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase; }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; padding: 8px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: background 160ms ease; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--navy-soft); color: var(--navy); font-weight: 600; }
  .nav-item[aria-current="page"] .ic { color: var(--navy); }
  [data-theme="dark"] .nav-item[aria-current="page"] { color: var(--amber-2); }
  [data-theme="dark"] .nav-item[aria-current="page"] .ic { color: var(--amber-2); }
  .nav-item .ic { width: 18px; height: 18px; flex-shrink: 0; color: var(--ink-3); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .util-row { display: flex; gap: 6px; }
  .util-btn { flex: 1; appearance: none; border: 1px solid var(--hairline-2); background: var(--surface-2); color: var(--ink-2); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  .util-btn:hover { background: var(--surface); color: var(--ink); }
  .signout { width: 100%; appearance: none; border: 1px solid rgba(210,83,58,0.25); background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 10px; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .meta-foot { font-size: 11px; color: var(--ink-3); display: flex; flex-direction: column; gap: 2px; padding: 6px 4px 0; }
  .meta-foot .sync { display: flex; align-items: center; gap: 6px; }
  .meta-foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  /* Main */
  .main { padding: 22px 28px 60px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .topbar h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin: 0; line-height: 1.1; }
  .topbar .sub { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .ibtn { appearance: none; border: 1px solid var(--hairline-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 500; padding: 9px 14px; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 1px 2px rgba(26,29,36,0.04); }
  .ibtn:hover { background: var(--surface-2); }
  .ibtn .ic { width: 15px; height: 15px; color: var(--ink-2); }

  .dept-tabs { display: flex; gap: 6px; padding: 4px; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 14px; margin-bottom: 16px; width: fit-content; }
  .dept-tab { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .dept-tab .ic { width: 15px; height: 15px; color: var(--ink-3); }
  .dept-tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 2px 6px rgba(26,29,36,0.06); font-weight: 600; }
  .dept-tab[aria-pressed="true"] .ic { color: var(--navy); }
  [data-theme="dark"] .dept-tab[aria-pressed="true"] .ic { color: var(--amber-2); }

  /* Section */
  .section { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg); box-shadow: var(--shadow-card); overflow: hidden; margin-bottom: 18px; }
  .section-head { padding: 16px 20px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--hairline); gap: 12px; flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .section-head .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

  /* Week tabs */
  .week-tabs { display: flex; gap: 8px; padding: 14px 20px 0; }
  .week-tab {
    appearance: none; border: 1px solid var(--hairline);
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 16px;
    cursor: pointer; font: inherit;
    text-align: left;
    transition: all 160ms ease;
    display: flex; flex-direction: column; gap: 2px;
    min-width: 120px;
  }
  .week-tab .top {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .week-tab .top .badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px;
  }
  .week-tab .top .badge.overdue { background: var(--red-soft); color: var(--red); }
  .week-tab .top .badge.current { background: var(--amber-soft); color: var(--amber); }
  .week-tab .bot { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .week-tab[aria-pressed="true"] {
    background: var(--surface);
    border-color: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-soft);
  }

  .meta-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
  .meta-row .l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .meta-row .l b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .meta-row .r { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .select-btn {
    appearance: none; border: 1px solid var(--hairline-2);
    background: var(--surface-2); color: var(--ink-2);
    font: inherit; font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .select-btn:hover { color: var(--red); border-color: rgba(210,83,58,0.3); background: var(--red-soft); }

  /* Order rows */
  .pri-list { padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .pri-row {
    display: grid;
    grid-template-columns: 44px 70px 1fr auto auto 70px 28px;
    align-items: center;
    gap: 14px;
    padding: 14px 14px;
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    transition: transform 120ms ease, box-shadow 200ms ease, background 160ms ease;
    cursor: grab;
  }
  .pri-row:hover {
    background: var(--surface);
    box-shadow: var(--shadow-pop);
    transform: translateY(-1px);
  }
  .pri-row:active { cursor: grabbing; }
  .pri-row.dragging { opacity: 0.5; }

  .rank {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 999px;
    background: var(--surface-3);
    color: var(--ink-2);
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .pri-row.top1 .rank { background: var(--navy); color: white; }
  .pri-row.top2 .rank { background: var(--amber); color: white; }
  .pri-row.top3 .rank { background: var(--amber-soft); color: var(--amber); }

  .ord-id {
    font-size: 14px; font-weight: 700; color: var(--amber);
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .prod-name {
    font-size: 15px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.01em;
    display: flex; align-items: baseline; gap: 8px;
  }
  .prod-name .qty {
    font-size: 12px; color: var(--ink-3); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .date-block {
    display: flex; flex-direction: column; gap: 1px;
    font-size: 11px; color: var(--ink-3); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.04em;
    text-align: center;
    min-width: 78px;
  }
  .date-block .v {
    font-size: 13px; font-weight: 600; color: var(--ink);
    text-transform: none; letter-spacing: -0.01em;
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .date-block .v .day {
    color: var(--green); font-weight: 600;
  }
  .date-block.dispatch .v .day { color: var(--green); }

  .cr-pill {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 10px;
    border-radius: 10px;
    background: var(--green-soft);
    color: var(--green);
    min-width: 56px;
  }
  .cr-pill b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .cr-pill span { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; margin-top: 2px; }
  .cr-pill.warn { background: var(--amber-soft); color: var(--amber); }
  .cr-pill.danger { background: var(--red-soft); color: var(--red); }
  .cr-pill.mid { background: var(--yellow-soft); color: var(--yellow); }

  .grip {
    color: var(--ink-3); display: flex; align-items: center; justify-content: center;
    cursor: grab; opacity: 0.6;
  }
  .grip:hover { opacity: 1; color: var(--ink-2); }

  /* New order row */
  .new-order {
    margin: 6px 14px 14px;
    background: var(--surface-2);
    border: 1.5px dashed var(--hairline-2);
    border-radius: var(--r-md);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 14px; font-weight: 500;
    transition: all 160ms ease;
  }
  .new-order:hover {
    background: var(--surface);
    border-color: var(--amber);
    color: var(--amber);
  }
  .new-order .chev { margin-left: auto; font-size: 11px; color: var(--ink-3); }

  /* Toggle */
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); font-weight: 500; padding: 6px 4px; }
  .toggle .switch { width: 32px; height: 18px; border-radius: 999px; background: var(--hairline-2); position: relative; cursor: pointer; }
  .toggle .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 200ms ease; }
  .toggle.on .switch { background: var(--navy); }
  .toggle.on .switch::after { transform: translateX(14px); }

  .ic { display: inline-block; vertical-align: middle; }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .side { position: relative; height: auto; }
    .pri-row { grid-template-columns: 36px 60px 1fr 56px; }
    .pri-row .date-block, .pri-row .grip { display: none; }
  }
</style>
</head>

    case 'print': return <svg {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>;
    case 'shield': return <svg {...p}><path d="M12 3 4 6v6c0 4.5 3.2 8.4 8 9 4.8-.6 8-4.5 8-9V6l-8-3Z"/></svg>;
    case 'logout': return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    case 'down': return <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    case 'up': return <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    case 'arrow': return <svg {...p}><path d="M5 12h14M13 5l7 7-7 7"/></svg>;
    case 'plus': return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case 'chev': return <svg {...p}><path d="m9 18 6-6-6-6"/></svg>;
    case 'chev-r': return <svg {...p}><path d="m9 18 6-6-6-6"/></svg>;
    case 'grip': return <svg {...p}><circle cx="9" cy="6" r="1.4" fill="currentColor"/><circle cx="9" cy="12" r="1.4" fill="currentColor"/><circle cx="9" cy="18" r="1.4" fill="currentColor"/><circle cx="15" cy="6" r="1.4" fill="currentColor"/><circle cx="15" cy="12" r="1.4" fill="currentColor"/><circle cx="15" cy="18" r="1.4" fill="currentColor"/></svg>;
    case 'trash': return <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case 'csv': return <svg {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>;
    case 'tpl': return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>;
    default: return null;
  }
};

function PriRow({ rank, ord, prod, qty, prodWk, prodDay, dispWk, dispDay, cr, crKind }) {
  const topClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
  return (
    <div className={`pri-row ${topClass}`} draggable>
      <div className="rank">{rank}</div>
      <div className="ord-id">{ord}</div>
      <div className="prod-name">{prod} <span className="qty">×{qty}</span></div>
      <div className="date-block">
        PROD
        <div className="v">{prodWk} <span className="day">{prodDay}</span></div>
      </div>
      <div className="date-block dispatch">
        DISPATCH
        <div className="v">{dispWk} <span className="day">{dispDay}</span></div>
      </div>
      <div className={`cr-pill ${crKind}`}>
        <b>{cr}</b><span>CR</span>
      </div>
      <div className="grip"><I n="grip" s={16}/></div>
    </div>
  );
}
