<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>elmo's Production — Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="elmo-base.css" />
<style>
  .add-grid { grid-template-columns: 1.4fr 1.4fr 1fr; }
  .add-grid .folder-field { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .add-grid .folder-field label { font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .add-grid .folder-field input { width: 240px; }
  .parts-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .parts-block .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .parts-block h4 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink); }
  .parts-empty { padding: 18px; text-align: center; color: var(--ink-3); font-size: 12px; background: var(--surface-2); border: 1px dashed var(--hairline-2); border-radius: var(--r-sm); }
  .save-row { margin-top: 14px; }
  .save-btn { background: var(--navy); color: white; border: 0; padding: 10px 18px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 14px rgba(31,42,68,0.22); }

  .folders-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .folders-bar h3 { margin: 0; }
  .folders-bar .add-folder { display: flex; align-items: center; gap: 6px; }
  .folders-bar .add-folder input { padding: 7px 10px; border: 1px solid var(--hairline-2); background: var(--surface-2); border-radius: 8px; font: inherit; font-size: 12px; min-width: 160px; }

  .folder { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-md); margin-bottom: 8px; box-shadow: var(--shadow-card); overflow: hidden; }
  .folder-head { display: grid; grid-template-columns: 18px 1fr auto auto; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; transition: background 120ms; }
  .folder-head:hover { background: var(--surface-2); }
  .folder-head .chev { color: var(--ink-3); transition: transform 180ms; }
  .folder.open .folder-head .chev { transform: rotate(90deg); }
  .folder-head .title { font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  .folder-head .count { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .folder-head .del { width: 28px; height: 28px; border-radius: 6px; background: var(--red-soft); color: var(--red); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .folder-body { display: none; border-top: 1px solid var(--hairline); background: var(--surface-2); }
  .folder.open .folder-body { display: block; }

  .prod-row { background: var(--surface); border-top: 1px solid var(--hairline); display: grid; grid-template-columns: 18px 1fr auto auto auto; gap: 10px; align-items: center; padding: 11px 14px; }
  .prod-row:first-child { border-top: 0; }
  .prod-row .chev { color: var(--ink-3); cursor: pointer; transition: transform 180ms; }
  .prod-row.open .chev { transform: rotate(90deg); }
  .prod-row .info .name { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prod-row .info .meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .abbr { display: inline-flex; align-items: center; gap: 4px; background: var(--amber-soft); color: var(--amber); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; font-family: ui-monospace, "SF Mono", monospace; letter-spacing: 0; }
  .prod-row .folder-sel select { padding: 6px 26px 6px 10px; font-size: 12px; border: 1px solid var(--hairline-2); background: var(--surface-2); border-radius: 7px; color: var(--ink); }
  .prod-row .edit { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hairline-2); border-radius: 7px; cursor: pointer; }
  .prod-row .edit .ic { color: var(--ink-3); }
  .prod-row .del { width: 28px; height: 28px; border-radius: 6px; background: var(--red-soft); color: var(--red); display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .part-block { background: var(--surface-2); border-top: 1px solid var(--hairline); padding: 10px 14px 10px 50px; display: none; }
  .prod-row.open + .part-block { display: block; }
  .part {
    display: grid; grid-template-columns: 26px 1fr auto;
    gap: 10px; align-items: center; padding: 8px 0;
  }
  .part + .part { border-top: 1px dashed var(--hairline); }
  .part .num { width: 24px; height: 24px; border-radius: 6px; background: var(--amber-soft); color: var(--amber); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .part .info .pname { font-size: 13px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .part .info .pname .x { font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .part .info .pname .badge { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-soft); color: var(--blue); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  .part .route { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .step-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; font-size: 11px; font-weight: 600;
    border-radius: 6px; letter-spacing: 0;
  }
  .step-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .step-chip .secs { font-weight: 500; opacity: 0.75; margin-left: 2px; }
  .step-chip.blue { background: var(--blue-soft); color: var(--blue); }
  .step-chip.blue .dot { background: var(--blue); }
  .step-chip.purple { background: var(--purple-soft); color: var(--purple); }
  .step-chip.purple .dot { background: var(--purple); }
  .step-chip.amber { background: var(--amber-soft); color: var(--amber); }
  .step-chip.amber .dot { background: var(--amber); }
  .step-chip.green { background: var(--green-soft); color: var(--green); }
  .step-chip.green .dot { background: var(--green); }
  .step-chip.teal { background: var(--teal-soft); color: var(--teal); }
  .step-chip.teal .dot { background: var(--teal); }
  .step-chip.muted { background: var(--surface-3); color: var(--ink-3); }
  .step-chip.muted .dot { background: var(--ink-3); }
  .step-chip .opt { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; margin-left: 4px; }
  .arrow { color: var(--ink-3); }

  .search-row { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-card); }
  .search-row input { flex: 1; border: 0; background: transparent; outline: 0; font: inherit; font-size: 13px; color: var(--ink); }
  .search-row .ic { color: var(--ink-3); }
</style>
</head>
<body data-theme="light">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" data-presets="env,react" src="shared-chrome.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

const FOLDERS = [
  { id: 'general', name: 'General', count: 4, items: [] },
  { id: 'tables', name: 'Tables', count: 4, items: [] },
  { id: 'benches', name: 'Benches', count: 7, items: [
    { name: 'Booth bench 1600 Sgl', abbr: ['KFC-Bnc160Sgl','RCP-Bnc160Sgl'], parts: 3, steps: 10 },
    { name: 'KFC Corner Bench 900', abbr: ['RCP-Bnc 90CU'], parts: 3, steps: 10, expanded: true,
      partList: [
        { num: 1, name: 'KFC Corner bnc sides', x: '2/unit', steps: [
          { lbl: 'Tube Laser', secs: '120s', color: 'blue' },
          { lbl: 'E32', secs: '45s', color: 'purple' },
          { lbl: 'Weld (Dino)', secs: '200s', color: 'amber' },
          { lbl: 'Grind', secs: '120s', color: 'green' },
          { lbl: 'Weld (Arrie)', secs: '', color: 'blue', opt: 'route' },
        ]},
        { num: 2, name: 'KFC Corner bnc reelings', x: '5/unit', steps: [
          { lbl: 'Tube Laser', secs: '25s', color: 'blue' },
          { lbl: 'Weld (Arrie)', secs: '', color: 'blue', opt: 'route' },
        ]},
        { num: 3, name: 'KFC Corner Assembly', x: '1/unit', badge: true, steps: [
          { lbl: 'Weld (Arrie)', secs: '360s', color: 'blue' },
          { lbl: 'Grind', secs: '120s', color: 'green' },
          { lbl: 'Paint', secs: '400s', color: 'muted' },
        ]},
      ]
    },
    { name: 'KFC Booth bench 1100 Dbl', abbr: ['KFC-Bnc110Dbl'], parts: 3, steps: 9 },
    { name: 'KFC Booth bench 110 Sgl', abbr: ['KFC-Bnc110Sgl','RCP-Bnc110Sgl'], parts: 3, steps: 10 },
    { name: 'KFC Booth Bench 1600 Dbl', abbr: ['KFC-Bnc1600Dbl','RCP-Bnc1600Dbl'], parts: 3, steps: 9 },
    { name: 'RCP Bench 1300 swage', abbr: ['RCP-Bnc130SS'], parts: 4, steps: 11 },
  ]},
];

function Stepper({ value = 5 }) {
  const [v, setV] = useState(value);
  return (
    <div className="stepper">
      <button onClick={() => setV(Math.max(1, v - 1))}>−</button>
      <input value={v} onChange={e => setV(Number(e.target.value) || 1)}/>
      <button onClick={() => setV(v + 1)}>+</button>
    </div>
  );
}

function PartRow({ p }) {
  return (
    <div className="part">
      <div className="num">{p.num}</div>
      <div className="info">
        <div className="pname">
          <span>{p.name}</span>
          <span className="x">×{p.x.replace('/unit',' / unit')}</span>
          {p.badge && <span className="badge">⚙ Assembly</span>}
        </div>
        <div className="route">
          {p.steps.map((s, i) => <React.Fragment key={i}>
            <span className={`step-chip ${s.color}`}>
              <span className="dot"/> {s.lbl}{s.secs && <span className="secs">{s.secs}</span>}
              {s.opt && <span className="opt">{s.opt}</span>}
            </span>
            {i < p.steps.length - 1 && <span className="arrow">→</span>}
          </React.Fragment>)}
        </div>
      </div>
    </div>
  );
}

function Folder({ f, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div className={`folder ${open ? 'open' : ''}`}>
      <div className="folder-head" onClick={() => setOpen(o => !o)}>
        <I n="chev-r" s={14} className="chev"/>
        <span className="title">{f.name}</span>
        <span className="count">{f.count} products</span>
        <span className="del" onClick={e => e.stopPropagation()}><I n="x" s={13}/></span>
      </div>
      <div className="folder-body">
        {f.items.map((p, i) => <ProductRow key={i} p={p}/>)}
      </div>
    </div>
  );
}

function ProductRow({ p }) {
  const [open, setOpen] = useState(!!p.expanded);
  return (
    <>
      <div className={`prod-row ${open ? 'open' : ''}`}>
        <I n="chev-r" s={14} className="chev" onClick={() => setOpen(o => !o)}/>
        <div className="info">
          <div className="name">
            {p.name}
            {p.abbr.map((a, i) => <span key={i} className="abbr">{a}</span>)}
          </div>
          <div className="meta">{p.parts} parts · {p.steps} steps</div>
        </div>
        <div className="folder-sel"><select><option>Benches</option><option>Tables</option><option>General</option></select></div>
        <span className="edit"><I n="edit" s={11}/> Edit</span>
        <span className="del"><I n="x" s={13}/></span>
      </div>
      {open && p.partList && (
        <div className="part-block" style={{display:'block'}}>
          {p.partList.map((pt, i) => <PartRow key={i} p={pt}/>)}
        </div>
      )}
    </>
  );
}

function App() {
  const [dept, setDept] = useState('steel');
  const [theme, setTheme] = useState('light');
  React.useEffect(() => { document.body.dataset.theme = theme; }, [theme]);

  return (
    <div className="app">
      <Sidebar active="prod"/>
      <main className="main">
        <div className="topbar">
          <div>
            <h1>Products</h1>
            <div className="sub">Define products, parts and their machine routes</div>
          </div>
          <div className="topbar-actions">
            <button className="ibtn"><I n="search" s={13}/> Find Order</button>
            <button className="ibtn"><I n="clock" s={13}/> End of Day</button>
            <button className="ibtn"><I n="key" s={13}/> Passwords</button>
            <button className="ibtn" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}>
              <I n={theme === 'light' ? 'moon' : 'sun'} s={13}/>{theme === 'light' ? 'Dark' : 'Light'}
            </button>
            <button className="ibtn primary"><I n="print" s={13}/> Print</button>
          </div>
        </div>

        <div className="filter-bar">
          <div className="dept-tabs">
            <button className="dept-tab" aria-pressed={dept==='all'} onClick={()=>setDept('all')}><I n="grid" s={12}/> All Depts</button>
            <button className="dept-tab" aria-pressed={dept==='steel'} onClick={()=>setDept('steel')}><I n="hammer" s={12}/> Steel</button>
            <button className="dept-tab" aria-pressed={dept==='wood'} onClick={()=>setDept('wood')}><I n="saw" s={12}/> Wood</button>
            <button className="dept-tab" aria-pressed={dept==='uphol'} onClick={()=>setDept('uphol')}><I n="thread" s={12}/> Upholstery</button>
            <button className="dept-tab" aria-pressed={dept==='disp'} onClick={()=>setDept('disp')}><I n="truck" s={12}/> Dispatching</button>
          </div>
        </div>

        <div className="dept-banner">
          <span className="badge"><I n="factory" s={12}/> Steel Department</span>
          <span>— showing Steel products & machines only</span>
        </div>

        <div className="search-row">
          <I n="search" s={14}/>
          <input placeholder="Search products by name or abbreviation…"/>
          <button className="ibtn"><I n="x" s={11}/> Clear</button>
        </div>

        <div className="card">
          <h3>Add New Product</h3>
          <div className="field-grid add-grid">
            <div className="field"><label>Product Name</label><input placeholder="e.g. Bowtie Diner"/></div>
            <div className="field"><label>Abbreviations (comma separated)</label><input placeholder="e.g. BTD, BT Diner, RCP-BowR"/></div>
            <div className="field"><label>Default Priority</label><Stepper value={5}/></div>
            <div className="folder-field">
              <label>Folder:</label>
              <input placeholder="Type or pick folder…"/>
            </div>
          </div>
          <div className="parts-block">
            <div className="head">
              <h4>Parts & Machine Steps</h4>
              <button className="ibtn"><I n="plus" s={12}/> Add Part</button>
            </div>
            <div className="parts-empty">No parts yet. Click "+ Add Part" to start.</div>
          </div>
          <div className="save-row">
            <button className="save-btn">Save Product</button>
          </div>
        </div>

        <div className="card folders-bar">
          <h3>Folders</h3>
          <div className="add-folder">
            <input placeholder="New folder name…"/>
            <button className="ibtn primary"><I n="plus" s={12}/> Add Folder</button>
          </div>
        </div>

        {FOLDERS.map(f => <Folder key={f.id} f={f} defaultOpen={f.id==='benches'}/>)}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
